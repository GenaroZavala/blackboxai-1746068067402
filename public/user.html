<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Usuario - Bolsa de Valores</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Roboto'] min-h-screen p-6">
  <header class="mb-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold">Panel de Usuario</h1>
    <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">
      Cerrar Sesión
    </button>
  </header>

  <section class="mb-8 bg-white p-6 rounded shadow-md max-w-4xl mx-auto">
    <h2 class="text-xl font-semibold mb-4">Mi Portafolio</h2>
    <table class="w-full table-auto border-collapse border border-gray-300">
      <thead>
        <tr class="bg-gray-200">
          <th class="border border-gray-300 px-4 py-2 text-left">Empresa</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Cantidad de Acciones</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Precio Actual</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Valor Total</th>
        </tr>
      </thead>
      <tbody id="portfolioTableBody">
        <!-- Portfolio will be populated here -->
      </tbody>
    </table>
  </section>

  <section class="bg-white p-6 rounded shadow-md max-w-4xl mx-auto">
    <h2 class="text-xl font-semibold mb-4">Comprar Acciones</h2>
    <form id="buySharesForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div>
        <label for="companySelect" class="block text-gray-700 mb-1">Empresa</label>
        <select id="companySelect" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
          <!-- Options will be populated here -->
        </select>
      </div>
      <div>
        <label for="quantity" class="block text-gray-700 mb-1">Cantidad</label>
        <input type="number" id="quantity" min="1" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition w-full">
          Comprar
        </button>
      </div>
    </form>
    <p id="buyMessage" class="mt-4 text-center text-red-600 hidden"></p>
  </section>

  <script src="js/user.js"></script>
</body>
</html>
