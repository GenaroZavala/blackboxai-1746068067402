<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Administrador - Bolsa de Valores</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Roboto'] min-h-screen p-6">
  <header class="mb-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold">Panel de Administrador</h1>
    <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">
      Cerrar Sesión
    </button>
  </header>

  <section class="mb-8 bg-white p-6 rounded shadow-md max-w-4xl mx-auto">
    <h2 class="text-xl font-semibold mb-4">Agregar Nueva Empresa</h2>
    <form id="addCompanyForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <div>
        <label for="companyName" class="block text-gray-700 mb-1">Nombre</label>
        <input type="text" id="companyName" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="sharesAvailable" class="block text-gray-700 mb-1">Acciones Disponibles</label>
        <input type="number" id="sharesAvailable" min="1" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="price" class="block text-gray-700 mb-1">Precio Inicial</label>
        <input type="number" id="price" min="1" step="0.01" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition w-full">
          Agregar Empresa
        </button>
      </div>
    </form>
  </section>

  <section class="bg-white p-6 rounded shadow-md max-w-4xl mx-auto">
    <h2 class="text-xl font-semibold mb-4">Empresas Existentes</h2>
    <table class="w-full table-auto border-collapse border border-gray-300">
      <thead>
        <tr class="bg-gray-200">
          <th class="border border-gray-300 px-4 py-2 text-left">Nombre</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Acciones Disponibles</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Precio Actual</th>
          <th class="border border-gray-300 px-4 py-2 text-left">Acciones</th>
        </tr>
      </thead>
      <tbody id="companiesTableBody">
        <!-- Companies will be populated here -->
      </tbody>
    </table>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
